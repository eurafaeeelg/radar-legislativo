name: Baixar deputados
on:
  schedule:
    - cron: "0 8 * * 1"   # toda segunda-feira
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deputados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python baixar_deputados.py
      - name: Salvar lista
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deputados.json
          git diff --cached --quiet || (git commit -m "Atualiza deputados" && git pull --rebase && git push)
