name: Gerar resumos
on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h no horário de Brasília
  workflow_dispatch:        # permite rodar manualmente
permissions:
  contents: write
jobs:
  resumos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python gerar_resumos.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Salvar resumos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add resumos.json
          git diff --cached --quiet || (git commit -m "Atualiza resumos" && git pull --rebase && git push)
